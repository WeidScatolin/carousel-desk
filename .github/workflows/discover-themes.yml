name: Discover themes
on:
  schedule:
    - cron: "17 09 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-discover
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Call discover endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLISH_API_TOKEN: ${{ secrets.PUBLISH_API_TOKEN }}
        run: node scripts/callPipeline.mjs discover
