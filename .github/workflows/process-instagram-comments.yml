name: Process Instagram comments (comment-to-DM)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-process-instagram-comments
  cancel-in-progress: false
jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || vars.INSTAGRAM_COMMENT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Call process-instagram-comments endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLISH_API_TOKEN: ${{ secrets.PUBLISH_API_TOKEN }}
        run: node scripts/callPipeline.mjs process-instagram-comments
