name: Publish scheduled Instagram posts
on:
  # Recovery-only entry point. The autonomous workflow checks due posts every
  # 15 minutes and publishes at most the item claimed by the API.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Call publish endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLISH_API_TOKEN: ${{ secrets.PUBLISH_API_TOKEN }}
        run: node scripts/callPipeline.mjs publish
