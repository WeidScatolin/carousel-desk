name: Run autonomous carousel pipeline
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-autopilot
  cancel-in-progress: false
jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Call autopilot endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLISH_API_TOKEN: ${{ secrets.PUBLISH_API_TOKEN }}
        run: node scripts/callPipeline.mjs autopilot
